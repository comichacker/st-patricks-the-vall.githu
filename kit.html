<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St. Patrick's Live Chat Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans flex items-center justify-center h-screen m-0">

    <!-- Standalone Live Chat Container -->
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg h-[85vh] flex flex-col overflow-hidden border border-blue-200">
        
        <!-- Header -->
        <div class="bg-blue-900 text-white p-4 flex justify-between items-center shadow">
            <div>
                <h3 class="font-bold text-base">St. Patrick's Live Communication</h3>
                <span class="text-xs text-blue-200">Online & Ready to Help</span>
            </div>
            <span class="bg-green-500 w-3 h-3 rounded-full animate-pulse"></span>
        </div>

        <!-- Chat History Box -->
        <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50 text-sm">
            <div class="bg-blue-100 text-blue-950 p-3 rounded-xl max-w-[85%] shadow-sm">
                <strong>St. Patrick's Desk:</strong> Hello! Welcome to the live chat. Type your message below to send it directly to our WhatsApp office line.
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-white border-t border-slate-200 flex gap-2">
            <input type="text" id="chat-input" placeholder="Type your message..." class="flex-1 px-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 bg-white text-slate-900">
            <button type="button" onclick="sendMessage()" class="bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold px-6 py-2 rounded-lg shadow text-sm transition">Send</button>
        </div>
    </div>

    <!-- Combined Standalone JavaScript -->
    <script>
    function sendMessage() {
        const input = document.getElementById('chat-input');
        const box = document.getElementById('chat-box');
        const userText = input.value.trim();
        
        if(userText !== "") {
            // 1. Append User Bubble to the Screen
            const userMsg = document.createElement('div');
            userMsg.className = "bg-blue-600 text-white p-3 rounded-xl max-w-[85%] ml-auto shadow-sm text-right";
            userMsg.innerHTML = "<strong>You:</strong> " + userText;
            box.appendChild(userMsg);
            
            input.value = "";
            box.scrollTop = box.scrollHeight;

            // 2. Open WhatsApp after a short pause so the user sees their message bubble
            setTimeout(() => {
                const phoneNumber = "2547"; 
                const encodedMessage = encodeURIComponent("Hello St. Patrick's Admin, my inquiry is: " + userText);
                window.open(`https://wa.me/${phoneNumber}?text=${encodedMessage}`, '_blank');
            }, 600);
        }
    }
    </script>

</body>
</html>
